[project]
name = "moodle-single-page"
version = "0.1.4"
description = "All your Moodle assignments at one glance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "keyring>=25.0",
    "playwright>=1.47",
    "anthropic>=0.69",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "flask>=3.1.3",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pyinstaller>=6.22.3",
]
